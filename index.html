<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тесты ГИБДД</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --accent: #2c3e50;
            --success: #27ae60;
            --success-bg: #eafaf1;
            --error: #e74c3c;
            --error-bg: #fdedec;
            --warning: #f39c12;
            --warning-bg: #fef9e7;
            --border: #e0e0e0;
            --shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent: #3498db;
            --success: #2ecc71;
            --success-bg: #1a3a2a;
            --error: #e74c3c;
            --error-bg: #3a1a1a;
            --warning: #f1c40f;
            --warning-bg: #3a3a1a;
            --border: #333;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        .container { max-width: 650px; margin: 0 auto; padding: 12px; }
        header { text-align: center; margin-bottom: 16px; }
        h1 { font-size: 1.4rem; margin: 8px 0; }
        h2 { font-size: 1.2rem; margin: 12px 0; }
        .screen { display: none; }
        .screen.active { display: block; }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 8px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            text-align: center;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-exit { background: var(--error); color: #fff; }
        .btn-exit:hover { opacity: 0.9; }
        .btn-next { background: var(--accent); color: #fff; margin-top: 12px; }
        .btn-next:hover { opacity: 0.9; }
        .btn-small { padding: 8px 16px; width: auto; display: inline-block; }
        .progress-wrap { margin: 12px 0; }
        .progress-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.3s; }
        .q-counter { text-align: center; font-weight: 600; margin-bottom: 8px; }
        .error-count { text-align: center; margin-bottom: 8px; font-size: 0.9rem; }
        .error-count.danger { color: var(--error); font-weight: bold; }
        .question-text { font-size: 1.05rem; margin-bottom: 16px; }
        .option-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 6px;
            border: 2px solid var(--border);
            border-radius: 10px;
            text-align: left;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 0.95rem;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--accent); }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { border-color: var(--success); background: var(--success-bg); color: var(--success); }
        .option-btn.wrong { border-color: var(--error); background: var(--error-bg); color: var(--error); }
        .feedback { padding: 10px; border-radius: 8px; margin-top: 8px; text-align: center; font-weight: 600; }
        .feedback.ok { background: var(--success-bg); color: var(--success); }
        .feedback.bad { background: var(--error-bg); color: var(--error); }
        .result-banner { text-align: center; padding: 20px; border-radius: 12px; margin-bottom: 16px; font-size: 1.3rem; font-weight: bold; }
        .result-banner.pass { background: var(--success-bg); color: var(--success); }
        .result-banner.fail { background: var(--error-bg); color: var(--error); }
        .error-detail { padding: 12px; margin-bottom: 8px; border-radius: 8px; border-left: 4px solid var(--error); background: var(--error-bg); }
        .error-detail .q { font-weight: 600; margin-bottom: 4px; }
        .error-detail .a { font-size: 0.9rem; }
        .theme-toggle { position: fixed; top: 8px; right: 8px; z-index: 100; }
        .warning-box { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning); border-radius: 8px; padding: 10px; text-align: center; margin-top: 8px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn btn-small theme-toggle" id="themeToggle" onclick="toggleTheme()">🌙</button>
        
        <div id="screen-start" class="screen active">
            <header><h1>Тесты ГИБДД</h1></header>
            <div class="card">
                <h2>Выберите раздел</h2>
                <button class="btn btn-primary" onclick="showTickets('fire')">Огневая подготовка<br><small>12 билетов по 20 вопросов</small></button>
                <button class="btn btn-primary" onclick="showTickets('service')">Служебная подготовка<br><small>5 билетов по 20 вопросов</small></button>
            </div>
        </div>

        <div id="screen-tickets" class="screen">
            <header><h1 id="tickets-title"></h1></header>
            <div class="card" id="ticket-list"></div>
            <button class="btn btn-exit" onclick="goHome()">← На главную</button>
        </div>

        <div id="screen-test" class="screen">
            <button class="btn btn-exit" onclick="exitTest()">Выход</button>
            <div class="card">
                <div class="q-counter" id="q-counter"></div>
                <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div></div>
                <div class="error-count" id="error-count"></div>
                <div class="question-text" id="q-text"></div>
                <div id="options"></div>
                <div id="feedback"></div>
                <div id="warning" class="warning-box" style="display:none;">Внимание: допущено 4 ошибки. Ещё одна — и тест не сдан!</div>
                <button class="btn btn-next" id="next-btn" style="display:none;" onclick="nextQuestion()">Далее</button>
            </div>
        </div>

        <div id="screen-results" class="screen">
            <header><h1>Результаты</h1></header>
            <div class="card">
                <div id="result-banner"></div>
                <div id="result-stats" style="text-align:center; margin-bottom:16px;"></div>
                <h2>Разбор ошибок</h2>
                <div id="error-list"></div>
            </div>
            <button class="btn btn-primary" id="retry-errors-btn" onclick="retryErrors()" style="display:none;">Повторить ошибочные вопросы</button>
            <button class="btn btn-primary" onclick="retryAll()">Пройти заново</button>
            <button class="btn btn-exit" onclick="goHome()">На главную</button>
        </div>
    </div>

    <script>
    const DATA = {"fire": [{"id": 1, "questions": [{"text": "В каких случаях сотрудник полиции имеет право лично или в составе подразделения (группы) применять огнестрельное оружие?", "options": ["а) Для пресечения попытки завладения транспортным средством, специальной техникой, состоящей на балансе муниципальных органов.", "б) Для освобождения заложников.", "в) Для пресечения административных правонарушений."], "correctIndex": 1}, {"text": "В каких случаях уведомляется прокурор о применении сотрудниками полиции физической силы, специальных средств и огнестрельного оружия?", "options": ["а) В случае применения сотрудником полиции физической силы, специальных средств или огнестрельного оружия.", "б) В случае причинения гражданину телесных повреждений в результате применения сотрудником полиции физической силы, специальных средств или огнестрельного оружия.", "в) В случае причинения гражданину ранения либо наступления его смерти в результате применения сотрудником полиции физической силы, специальных средств или огнестрельного оружия."], "correctIndex": 2}, {"text": "В каких случаях сотрудник полиции имеет право обнажить огнестрельное оружие и привести его в готовность?", "options": ["а) Для защиты другого лица либо себя от посягательства, если это посягательство сопряжено с насилием, опасным для жизни и здоровья.", "б) Для преодоления противодействия законным требованиям сотрудника полиции.", "в) Для защиты граждан и их имущества от нападения, когда другими способами предотвратить его невозможно."], "correctIndex": 0}, {"text": "Какие действия должен выполнить сотрудник по команде «Разряжай» при выполнении упражнений стрельб из пистолета?", "options": ["а) Извлечь из кассеты (ствола) патрон (патроны), удерживать патрон (патроны) в руке, осмотреть кассету (ствол) пистолета. Предъявить их и кассету (ствол) пистолета к осмотру руководителю стрельб (гранатометания).", "б) Извлечь магазин из основания рукоятки пистолета (извлечь патрон (патроны) из канала ствола), осмотреть патронник оружия (при необходимости извлечь из магазина патрон (патроны), удержать патрон (патроны) и (или) магазин в руке. Предъявить их и патронник к осмотру руководителю стрельб (гранатометания).", "в) Извлечь магазин из основания рукоятки. Снять затвор с затворной задержки, включить предохранитель. Пистолет удерживается направленным в сторону мишени до команды «Оружие к осмотру»."], "correctIndex": 1}, {"text": "Какие действия должен выполнить сотрудник по команде «Приготовиться к стрельбе» при выполнении упражнений стрельб из пистолета?", "options": ["а) Осуществить проверку оружия на незаряженность, приготовить его к стрельбе, проверить работу ударно-спускового механизма, производя несколько выстрелов вхолостую в сторону мишени (кроме оружия, у которого данные действия могут привести к поломке), снять с боевого взвода курок или деактивировать ударник нажатием на спусковой крючок в сторону мишени, включить предохранитель (при его наличии), убрать оружие в кобуру или взять в положение \"На ремень\" либо удержать его в руках с соблюдением мер безопасности.", "б) Извлечь пистолет из кобуры, вставить снаряженный магазин в основание рукоятки пистолета, убрать пистолет в кобуру и застегнуть ее. После доложить о готовности к стрельбе.", "в) Выдвинуться на огневой рубеж, надеть противошумные наушники, вставить снаряженный магазин в основание рукоятки пистолета и доложить о готовности к стрельбе."], "correctIndex": 0}, {"text": "Какие действия должен выполнить сотрудник по команде «Огонь» («Вперед», «К бою») при выполнении упражнений стрельб из пистолета?", "options": ["а) Извлечь пистолет из кобуры, вставить снаряженный магазин в основание рукоятки пистолета, убрать пистолет в кобуру и застегнуть ее. Доложить о готовности к стрельбе.", "б)При необходимости выдвинуться на огневой рубеж, извлечь пистолет из кобуры, выключить предохранитель, дослать патрон в патронник и произвести прицельный огонь. По окончании стрельбы убрать палец со спускового крючка, удерживая оружие в руке в направлении мишени, встать лицом к мишени и доложить об окончании стрельбы.", "в) Выдвинуться на огневой рубеж, принять положение для стрельбы, выключить предохранитель (при наличии), дослать патрон в патронник (за исключением бесствольного оружия и выстрелов к гранатометам), удерживать оружие дульной частью в сторону мишени, накладывать палец на спусковой крючок и приступать к выполнению упражнения в соответствии с его условиями и порядком. По окончании выполнения упражнения убрать палец со спускового крючка, удерживая оружие дульной частью в сторону мишени и доложить руководителю стрельб (гранатометания), называть свои специальное звание, фамилию: \"Стрельбу закончил\"."], "correctIndex": 2}, {"text": "Разрешается ли сотруднику направлять незаряженное оружие на людей или в направлениях их возможного появления при выполнении упражнений стрельб?", "options": ["а) Запрещается.", "б) Разрешается, если предохранитель включен."], "correctIndex": 0}, {"text": "В каких случаях сотрудник может заряжать оружие боевыми (холостыми) патронами без команды руководителя стрельб?", "options": ["а) В случае, когда разрешение дает начальник пункта боепитания.", "б) В случае отсутствия руководителя стрельб.", "в) Во всех перечисленных случаях запрещается."], "correctIndex": 2}, {"text": "В каких случаях сотрудник может оставлять оружие, боеприпасы или гранаты на огневом рубеже?", "options": ["а) В случае, когда разрешение дает руководитель стрельб.", "б) В случае, когда разрешение дает руководитель учебной группы.", "в) Во всех перечисленных случаях."], "correctIndex": 0}, {"text": "В каких случаях сотрудник может открывать или вести огонь (гранатометание) при поднятом белом флаге (фонаре) на командном пункте тира, стрельбища или полигона?", "options": ["а) Открывать или вести огонь (гранатометание) при поднятом белом флаге (фонаре) сотруднику разрешается по команде руководителя стрельб.", "б) Запрещается открывать или вести огонь (гранатометание) при поднятом белом флаге (фонаре)."], "correctIndex": 1}, {"text": "Какая форма доклада осуществляется сотрудником руководителю стрельб по окончании осмотра мишени и определении результата выполнения упражнений?", "options": ["а) Сержант полиции Иванов выполняя упражнение (сотрудник называет номер упражнения) поразил мишень тремя пулями – оценка «удовлетворительно».", "б) Сержант полиции Иванов поразил мишень тремя патронами - оценка «удовлетворительно».", "в) Сержант полиции Иванов поразил мишень тремя пулями - оценка «удовлетворительно»."], "correctIndex": 2}, {"text": "Какая форма доклада осуществляется сотрудником руководителю стрельб на огневом рубеже перед началом стрельбы (гранатометания)?", "options": ["а) Сержант полиции Иванов три боевых патрона получил и осмотрел.", "б) Сержант полиции Иванов к стрельбе (гранатометанию) готов.", "в) Сержант полиции Иванов к выполнению упражнения готов."], "correctIndex": 1}, {"text": "Какие действия должен выполнить сотрудник, если при выполнении упражнений стрельб патрон оказался выброшенным из патронника?", "options": ["а) Если патрон оказался выброшенным из патронника, то стрельбу следует продолжать до израсходования всех патронов, а по окончании стрельбы доложить руководителю стрельб о не израсходовании патрона.", "б) Сотрудник должен прекратить стрельбу, включить предохранитель и поднять свободную руку вверх.", "в) Сотрудник должен поднять свободную руку вверх удерживая оружие в направлении мишени и доложить руководителю стрельб."], "correctIndex": 0}, {"text": "Какое назначение имеет 9-мм пистолет Макарова?", "options": ["а) Предназначен для поражения противника на коротких расстояниях.", "б) Предназначен для уничтожения живой силы противника.", "в) Предназначен для поражения противника на различных расстояниях."], "correctIndex": 0}, {"text": "Боевая скорострельность 9-мм пистолета Макарова.", "options": ["а) 30 выстрелов/минуту.", "б) 40 выстрелов/минуту.", "в) 50 выстрелов/минуту."], "correctIndex": 0}, {"text": "Сколько весит 5,45 мм АКС 74У со снаряженным магазином (с магазином без патронов)?", "options": ["а) 3,3 кгс патронами (3,8 кг без патронов).", "б) 3,5 кг с патронами (3.0 кг без патронов).", "в) 3,0 кг с патронами (2,5 кг без патронов)."], "correctIndex": 2}, {"text": "Из каких основных частей и механизмов состоит 9-мм пистолет Макарова?", "options": ["а) Рамка со стволом и спусковой скобой, затвор с ударником, выбрасывателем и предохранителем, ударно-спусковой механизм, рукоятка с винтом, затворная задержка, магазин.", "б) Рамка со стволом и спусковой скобой, затвор с ударником, выбрасывателем и предохранителем, возвратная пружина, ударно-спусковой механизм, рукоятка с винтом, затворная задержка, магазин.", "в) Рамка со стволом и спусковой скобой, затвор с ударником, выбрасывателем и предохранителем, возвратная пружина, ударно-спусковой механизм, затворная задержка, магазин."], "correctIndex": 1}, {"text": "Какие существуют причины возникновения задержки «прихват (ущемление) гильзы затвором» при стрельбе из 9-мм пистолета Макарова?", "options": ["а) Загрязнение магазина и подвижных частей пистолета, погнутость верхних краев корпуса магазина.", "б) Загрязнение патронника, пазов рамки и чашечки затвора.", "в) Загрязнение подвижных частей пистолета и неисправность выбрасывателя, его пружины или отражателя."], "correctIndex": 2}, {"text": "Какие действия должен выполнить сотрудник на огневом рубеже при возникновении задержек при стрельбе из 9-мм пистолета Макарова?", "options": ["а) По возможности включить предохранитель и поднять свободную от удержания оружия руку вверх.", "б) Самостоятельно устранить задержку.", "в) По возможности включить предохранитель, убрать оружие в кобуру и поднять руку вверх."], "correctIndex": 0}, {"text": "Какие существуют способы устранения задержки «прихват (ущемление) гильзы затвором» при стрельбе из 9-мм пистолета Макарова?", "options": ["а) Перезарядить пистолет и продолжить стрельбу, прочистить пистолет и магазин.", "б) Выбросить прихваченную гильзу и продо     let state = {
        section: null,
        ticketIdx: 0,
        qIdx: 0,
        errors: 0,
        answers: [],
        retryMode: false,
        retryQuestions: [],
    };

    // Theme
    function toggleTheme() {
        const cur = document.documentElement.getAttribute('data-theme');
        const next = cur === 'dark' ? '' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        document.getElementById('themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
        try { localStorage.setItem('theme', next); } catch(e) {}
    }
    (function() {
        try {
            const t = localStorage.getItem('theme');
            if (t === 'dark') { document.documentElement.setAttribute('data-theme','dark'); document.getElementById('themeToggle').textContent='☀️'; }
        } catch(e) {}
    })();

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0, 0);
    }

    function goHome() {
        state = { section: null, ticketIdx: 0, qIdx: 0, errors: 0, answers: [], retryMode: false, retryQuestions: [] };
        showScreen('screen-start');
    }

    function showTickets(section) {
        state.section = section;
        state.ticketIdx = 0;
        const title = section === 'fire' ? 'Огневая подготовка' : 'Служебная подготовка';
        document.getElementById('tickets-title').textContent = title;
        const list = document.getElementById('ticket-list');
        list.innerHTML = '';
        DATA[section].forEach((ticket, i) => {
            const btn = document.createElement('button');
            btn.className = 'btn btn-primary';
            btn.innerHTML = 'Билет ' + (i + 1);
            btn.onclick = () => { state.ticketIdx = i; startTest(false); };
            list.appendChild(btn);
        });
        showScreen('screen-tickets');
    }

    function startTest(retryErrors) {
        state.retryMode = retryErrors;
        state.qIdx = 0;
        state.errors = 0;
        state.answers = [];
        state.retryQuestions = [];
        if (retryErrors) {
            // retryQuestions will be set by retryErrors()
        }
        showScreen('screen-test');
        loadQuestion();
    }

    function getQuestions() {
        const ticket = DATA[state.section][state.ticketIdx];
        if (state.retryMode && state.retryQuestions.length > 0) {
            return state.retryQuestions.map(idx => ({ ...ticket.questions[idx], _origIdx: idx }));
        }
        return ticket.questions.map((q, i) => ({ ...q, _origIdx: i }));
    }

    function loadQuestion() {
        const questions = getQuestions();
        const q = questions[state.qIdx];
        document.getElementById('q-counter').textContent = 'Вопрос ' + (state.qIdx + 1) + ' из ' + questions.length;
        const pct = (state.qIdx / questions.length) * 100;
        document.getElementById('progress-fill').style.width = pct + '%';
        
        const errEl = document.getElementById('error-count');
        errEl.textContent = 'Ошибок: ' + state.errors + ' (допустимо не более 4)';
        errEl.className = 'error-count' + (state.errors >= 4 ? ' danger' : '');
        
        document.getElementById('q-text').textContent = q.text;
        const optsEl = document.getElementById('options');
        optsEl.innerHTML = '';
        q.options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.onclick = () => selectAnswer(i, q.correctIndex, btn);
            optsEl.appendChild(btn);
        });
        
        document.getElementById('feedback').innerHTML = '';
        document.getElementById('next-btn').style.display = 'none';
        
        const warnEl = document.getElementById('warning');
        warnEl.style.display = (state.errors >= 4) ? 'block' : 'none';
    }

    function selectAnswer(selectedIdx, correctIdx, btnEl) {
        document.querySelectorAll('#options .option-btn').forEach(b => b.disabled = true);
        const isCorrect = selectedIdx === correctIdx;
        const questions = getQuestions();
        const q = questions[state.qIdx];
        
        state.answers.push({ origIdx: q._origIdx, selected: selectedIdx, correct: correctIdx, isCorrect: isCorrect });
        
        if (isCorrect) {
            btnEl.classList.add('correct');
            const fb = document.getElementById('feedback');
            fb.innerHTML = '<div class="feedback ok">✓ Правильно!</div>';
        } else {
            btnEl.classList.add('wrong');
            const allBtns = document.querySelectorAll('#options .option-btn');
            allBtns[correctIdx].classList.add('correct');
            const fb = document.getElementById('feedback');
            fb.innerHTML = '<div class="feedback bad">✗ Неверно. Правильный ответ выделен зелёным.</div>';
            state.errors++;
            const errEl = document.getElementById('error-count');
            errEl.textContent = 'Ошибок: ' + state.errors + ' (допустимо не более 4)';
            errEl.className = 'error-count' + (state.errors >= 4 ? ' danger' : '');
            if (state.errors >= 4) {
                document.getElementById('warning').style.display = 'block';
            }
        }
        
        const nextBtn = document.getElementById('next-btn');
        const isLast = state.qIdx >= questions.length - 1;
        nextBtn.textContent = isLast ? 'Показать результаты' : 'Далее';
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        const questions = getQuestions();
        if (state.qIdx >= questions.length - 1) {
            showResults();
        } else {
            state.qIdx++;
            loadQuestion();
        }
    }

    function showResults() {
        const questions = getQuestions();
        const total = questions.length;
        const passed = state.errors <= 4;
        
        document.getElementById('progress-fill').style.width = '100%';
        
        const banner = document.getElementById('result-banner');
        banner.className = 'result-banner ' + (passed ? 'pass' : 'fail');
        banner.textContent = passed ? '✓ Тест сдан!' : '✗ Тест не сдан';
        
        document.getElementById('result-stats').innerHTML = 
            'Правильных ответов: ' + (total - state.errors) + ' из ' + total + '<br>' +
            'Ошибок: ' + state.errors + (state.errors <= 4 ? ' (в пределах нормы)' : ' (превышение лимита)');
        
        // Error details
        const errList = document.getElementById('error-list');
        errList.innerHTML = '';
        const wrongAnswers = state.answers.filter(a => !a.isCorrect);
        if (wrongAnswers.length === 0) {
            errList.innerHTML = '<p style="text-align:center; color:var(--success);">Ошибок нет! Отличный результат!</p>';
        } else {
            const ticket = DATA[state.section][state.ticketIdx];
            wrongAnswers.forEach(a => {
                const q = ticket.questions[a.origIdx];
                const div = document.createElement('div');
                div.className = 'error-detail';
                div.innerHTML = 
                    '<div class="q">Вопрос ' + (a.origIdx + 1) + ': ' + q.text + '</div>' +
                    '<div class="a">Ваш ответ: ' + q.options[a.selected] + '</div>' +
                    '<div class="a" style="color:var(--success);">Правильный ответ: ' + q.options[a.correct] + '</div>';
                errList.appendChild(div);
            });
        }
        
        // Show retry button only if there are errors
        document.getElementById('retry-errors-btn').style.display = (state.errors > 0) ? 'block' : 'none';
        
        showScreen('screen-results');
    }

    function retryErrors() {
        state.retryQuestions = state.answers.filter(a => !a.isCorrect).map(a => a.origIdx);
        state.qIdx = 0;
        state.errors = 0;
        state.answers = [];
        state.retryMode = true;
        showScreen('screen-test');
        loadQuestion();
    }

    function retryAll() {
        startTest(false);
    }

    function exitTest() {
        if (confirm('Вы уверены, что хотите выйти? Прогресс будет потерян.')) {
            goHome();
        }
    }
    </script>
